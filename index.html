<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LÁMPARA - Juego Bíblico de Génesis (RVR1960)</title>
    <!-- Cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --gold: #c9a84c;
            --gold-light: #e0c060;
            --gold-dark: #8B6914;
            --brown: #5a3d2b;
            --cream: #f5e6c8;
            --dark: #1a1a2e;
            --red: #f44336;
            --green: #4CAF50;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05050d;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100dvh;
            max-width: 800px;
            max-height: 600px;
            aspect-ratio: 4/3;
            background: #000;
            box-shadow: 0 0 50px rgba(255, 200, 50, 0.15);
            overflow: hidden;
        }
        @media (max-aspect-ratio: 4/3) {
            #gameContainer {
                width: 100vw;
                height: 75vw;
            }
        }
        @media (min-aspect-ratio: 4/3) {
            #gameContainer {
                height: 100dvh;
                width: 133.33dvh;
            }
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            cursor: pointer;
        }
        #developerCredit {
            position: absolute;
            bottom: 6px;
            right: 12px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 11px;
            font-family: 'Georgia', serif;
            z-index: 5;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
        #dialogOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.88);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(4px);
            padding: 10px;
        }
        #dialogOverlay.active {
            display: flex;
            opacity: 1;
        }
        .dialog-box {
            background: linear-gradient(180deg, #f5e6c8 0%, #e8d5a3 100%);
            border: 3px solid var(--gold);
            border-radius: 18px;
            padding: 20px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 0 35px rgba(201,168,76,0.5);
            transform: translateY(15px) scale(0.96);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
            max-height: 90dvh;
            overflow-y: auto;
        }
        #dialogOverlay.active .dialog-box {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        #dialogOverlay.closing .dialog-box {
            transform: translateY(-15px) scale(0.96);
            opacity: 0;
        }
        .dialog-box h2 { 
            color: var(--brown); 
            font-size: 1.3em; 
            margin-bottom: 8px;
        }
        .dialog-box p.description {
            color: #4a3324;
            font-size: 0.95em;
            line-height: 1.45;
            margin: 10px 0 15px 0;
            background: rgba(255,255,255,0.55);
            padding: 10px;
            border-radius: 8px;
            border-left: 4px solid var(--gold);
        }
        .dialog-box input {
            width: 90%;
            padding: 10px;
            margin: 6px 0;
            font-size: 1em;
            border: 2px solid var(--gold);
            border-radius: 8px;
            background: #fff;
            color: #333;
            font-family: 'Georgia', serif;
            outline: none;
            text-align: center;
        }
        .dialog-box button {
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
            color: #1a1a2e;
            border: 2px solid var(--gold-dark);
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
            transition: all 0.2s;
            font-family: 'Georgia', serif;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
            width: 100%;
        }
        .dialog-box button:active { 
            transform: scale(0.98);
        }
        .timer-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 6px 0 4px 0;
            font-weight: bold;
            color: var(--brown);
        }
        .timer-badge {
            background: var(--brown);
            color: var(--gold-light);
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .timer-badge.urgent {
            background: var(--red);
            color: #fff;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.06); }
        }
        .timer-bar {
            width: 100%;
            height: 5px;
            background: #d4c4a0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .timer-fill {
            height: 100%;
            background: var(--green);
            width: 100%;
            transition: width 1s linear, background-color 0.3s;
        }
        .progress-bar {
            width: 100%;
            height: 5px;
            background: #d4c4a0;
            border-radius: 3px;
            margin: 5px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold-dark) 0%, var(--gold) 50%, var(--gold-light) 100%);
            transition: width 0.4s ease;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }
        .option-btn {
            background: #fff;
            border: 2px solid var(--gold);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Georgia', serif;
            color: #333;
            text-align: left;
        }
        .option-btn.correct { 
            background: linear-gradient(180deg, #66BB6A 0%, var(--green) 100%); 
            color: #fff; 
            border-color: #2E7D32; 
        }
        .option-btn.incorrect { 
            background: linear-gradient(180deg, #EF5350 0%, var(--red) 100%); 
            color: #fff; 
            border-color: #c62828; 
            animation: shake 0.4s;
        }
        .option-btn:disabled { cursor: default; opacity: 0.9; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .score-display { 
            font-size: 1em; 
            color: var(--brown); 
            margin: 4px 0; 
            font-weight: bold;
        }
        .verse-display {
            background: #fff;
            border: 2px solid var(--gold);
            border-radius: 10px;
            padding: 10px;
            margin: 6px 0;
            font-style: italic;
            color: #333;
            font-size: 0.9em;
            line-height: 1.4;
        }
        .verse-missing { color: var(--red); font-weight: bold; text-decoration: underline; }
        .leaderboard {
            background: #fff;
            border: 2px solid var(--gold);
            border-radius: 10px;
            padding: 8px;
            margin: 10px 0;
            max-height: 180px;
            overflow-y: auto;
        }
        .leaderboard table { width: 100%; border-collapse: collapse; }
        .leaderboard th { background: var(--gold); color: #1a1a2e; padding: 5px; font-size: 0.8em; }
        .leaderboard td { padding: 5px; font-size: 0.78em; border-bottom: 1px solid #ddd; color: #333; }
        .status-badge {
            background: #e0c060;
            color: #5a3d2b;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8em;
            margin-bottom: 6px;
            display: inline-block;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="developerCredit">Desarrollado por Nelson_F</div>
        <div id="dialogOverlay">
            <div class="dialog-box" id="dialogBox"></div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // ================== CONFIGURACIÓN SUPABASE ==================
            const SUPABASE_URL = "https://ayzdvkitozqtvvlxphfl.supabase.co";
            const SUPABASE_ANON_KEY = "sb_publishable_Z1JAN0l80o7sQFqRMVDNOw_poV3Ed3O";
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const W = 800, H = 600;
            const dialogOverlay = document.getElementById('dialogOverlay');
            const dialogBox = document.getElementById('dialogBox');

            let animationId = null;
            let sparkSoundCounter = 0;

            const QUESTION_TIME_LIMIT = 15;
            let timeLeft = QUESTION_TIME_LIMIT;
            let timerInterval = null;

            // ================== FUNCIONES BASE DE DATOS ==================
            async function saveSupabaseScore(name, age, score, medal) {
                try {
                    const { data, error } = await supabaseClient
                        .from('puntuaciones')
                        .insert([{ nombre: name, edad: age, puntos: score, medalla: medal }]);

                    if (error) {
                        if (error.code === '23505') return { isFirstTime: false };
                        return { error: true };
                    }
                    return { isFirstTime: true };
                } catch (err) {
                    return { error: true };
                }
            }

            async function getTopScores() {
                try {
                    const { data, error } = await supabaseClient
                        .from('puntuaciones')
                        .select('nombre, edad, puntos, medalla')
                        .order('puntos', { ascending: false })
                        .limit(10);

                    if (error) return [];
                    return data;
                } catch (err) {
                    return [];
                }
            }

            async function checkPlayerExists(name, age) {
                try {
                    const { data } = await supabaseClient
                        .from('puntuaciones')
                        .select('nombre')
                        .eq('nombre', name)
                        .eq('edad', age)
                        .maybeSingle();

                    return data !== null;
                } catch(e) {
                    return false;
                }
            }

            // ================== AUDIO ==================
            let audioCtx = null;
            function initAudio() {
                if (!audioCtx) {
                    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
            }
            
            function playSound(type) {
                if (!audioCtx || audioCtx.state !== 'running') return;
                try {
                    const now = audioCtx.currentTime;
                    switch(type) {
                        case 'spark':
                            if (sparkSoundCounter < 5) {
                                const osc = audioCtx.createOscillator();
                                const gain = audioCtx.createGain();
                                osc.connect(gain); gain.connect(audioCtx.destination);
                                osc.frequency.setValueAtTime(1200, now);
                                osc.frequency.exponentialRampToValueAtTime(300, now + 0.15);
                                gain.gain.setValueAtTime(0.1, now);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                                osc.start(now); osc.stop(now + 0.15);
                                sparkSoundCounter++;
                            }
                            break;
                        case 'correct':
                            [523, 659, 784].forEach((freq, i) => {
                                const osc = audioCtx.createOscillator();
                                const gain = audioCtx.createGain();
                                osc.connect(gain); gain.connect(audioCtx.destination);
                                osc.frequency.value = freq;
                                gain.gain.setValueAtTime(0.12, now + i * 0.1);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.3);
                                osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.3);
                            });
                            break;
                        case 'wrong':
                            const oscW = audioCtx.createOscillator();
                            const gainW = audioCtx.createGain();
                            oscW.connect(gainW); gainW.connect(audioCtx.destination);
                            oscW.frequency.value = 180; oscW.type = 'sawtooth';
                            gainW.gain.setValueAtTime(0.1, now);
                            gainW.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                            oscW.start(now); oscW.stop(now + 0.35);
                            break;
                        case 'tick':
                            const oscK = audioCtx.createOscillator();
                            const gainK = audioCtx.createGain();
                            oscK.connect(gainK); gainK.connect(audioCtx.destination);
                            oscK.frequency.value = 800; oscK.type = 'square';
                            gainK.gain.setValueAtTime(0.03, now);
                            gainK.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                            oscK.start(now); oscK.stop(now + 0.05);
                            break;
                        case 'win':
                            [523, 659, 784, 1047].forEach((freq, i) => {
                                const osc = audioCtx.createOscillator();
                                const gain = audioCtx.createGain();
                                osc.connect(gain); gain.connect(audioCtx.destination);
                                osc.frequency.value = freq;
                                gain.gain.setValueAtTime(0.12, now + i * 0.15);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.4);
                                osc.start(now + i * 0.15); osc.stop(now + i * 0.15 + 0.4);
                            });
                            break;
                    }
                } catch(e) {}
            }

            // ================== BANCOS DE PREGUNTAS (REINA VALERA 1960) ==================
            const poolEtapa1 = [
                { question: "¿De qué árbol prohibió Dios comer al hombre en el huerto de Edén?", options: ["Del árbol de la vida", "Del árbol de la ciencia del bien y del mal", "Del árbol de la sabiduría", "Del árbol del conocimiento divino"], correct: 1 },
                { question: "¿Qué puso Jehová sobre Caín para que no lo matase cualquiera que le hallara?", options: ["Una señal", "Una marca en la frente", "Una túnica de protección", "Un sello de fuego"], correct: 0 },
                { question: "¿De qué clase de madera mandó Dios a Noé hacer el arca?", options: ["Madera de cedro", "Madera de gofer", "Madera de ciprés", "Madera de olivo"], correct: 1 },
                { question: "¿Qué edad tenía Noé cuando el diluvio de las aguas vino sobre la tierra?", options: ["Seiscientos años", "Quinientos años", "Setecientos años", "Cuatrocientos cincuenta años"], correct: 0 },
                { question: "¿Quién fue el padre de los que habitan en tiendas y crían ganados?", options: ["Jabal", "Jubal", "Tubal-caín", "Naama"], correct: 0 },
                { question: "¿Cómo se llamaba la esposa de Abram (Abraham)?", options: ["Ketura", "Agar", "Sarai", "Rebeca"], correct: 2 },
                { question: "¿Cuál era el nombre del primer hijo que tuvo Abraham con Agar la egipcia?", options: ["Ismael", "Isaac", "Esaú", "Jacob"], correct: 0 },
                { question: "¿Qué hijo le dio a luz Sara a Abraham en su vejez?", options: ["Ismael", "Isaac", "Jacob", "Esaú"], correct: 1 },
                { question: "¿Por cuántas piezas de plata vendieron sus hermanos a José a los ismaelitas?", options: ["Treinta piezas de plata", "Veinte piezas de plata", "Cincuenta piezas de plata", "Diez piezas de plata"], correct: 1 },
                { question: "¿Cuántos años vivió Matusalén en total?", options: ["Novecientos sesenta y nueve años", "Novecientos cincuenta años", "Ochocientos noventa y cinco años", "Novecientos treinta años"], correct: 0 }
            ];

            const poolEtapa2 = [
                { question: "¿En qué capítulo de Génesis se narra la desobediencia y caída del hombre?", options: ["Capítulo 2", "Capítulo 3", "Capítulo 4", "Capítulo 5"], correct: 1 },
                { question: "¿En qué capítulo de Génesis se registra el libro de las generaciones de Adán hasta Noé?", options: ["Capítulo 4", "Capítulo 5", "Capítulo 6", "Capítulo 7"], correct: 1 },
                { question: "¿En qué capítulo de Génesis establece Dios su pacto de la circuncisión y cambia el nombre de Abram a Abraham?", options: ["Capítulo 15", "Capítulo 16", "Capítulo 17", "Capítulo 18"], correct: 2 },
                { question: "¿En qué capítulo de Génesis ocurre la destrucción de Sodoma y Gomorra?", options: ["Capítulo 17", "Capítulo 18", "Capítulo 19", "Capítulo 20"], correct: 2 },
                { question: "¿En qué capítulo de Génesis se relata el sueño de José sobre las manojos/gavillas que se inclinaban?", options: ["Capítulo 35", "Capítulo 36", "Capítulo 37", "Capítulo 38"], correct: 2 },
                { question: "¿En qué capítulo de Génesis se narra la creación de los cielos y la tierra en seis días?", options: ["Capítulo 1", "Capítulo 2", "Capítulo 3", "Capítulo 4"], correct: 0 },
                { question: "¿En qué capítulo de Génesis se relata la torre de Babel y la confusión de las lenguas?", options: ["Capítulo 9", "Capítulo 10", "Capítulo 11", "Capítulo 12"], correct: 2 },
                { question: "¿En qué capítulo de Génesis llama Dios a Abram a salir de su tierra y su parentela?", options: ["Capítulo 10", "Capítulo 11", "Capítulo 12", "Capítulo 13"], correct: 2 },
                { question: "¿En qué capítulo de Génesis manda Dios a Abraham a ofrecer a Isaac en el monte Moriah?", options: ["Capítulo 20", "Capítulo 21", "Capítulo 22", "Capítulo 23"], correct: 2 },
                { question: "¿En qué capítulo de Génesis lucha Jacob con un varón hasta el rayar del alba en Peniel?", options: ["Capítulo 30", "Capítulo 31", "Capítulo 32", "Capítulo 33"], correct: 2 }
            ];

            const poolEtapa3 = [
                { verse: "Y creó Dios al hombre a su ______, a imagen de Dios lo creó; varón y hembra los creó. (Gn 1:27)", options: ["imagen", "semejanza", "voluntad", "gloria"], correct: 0 },
                { verse: "Y se arrepintió Jehová de haber hecho hombre en la tierra, y le ______ en su corazón. (Gn 6:6)", options: ["dolió", "pesó", "entristeció", "lamentó"], correct: 0 },
                { verse: "Y creyó a Jehová, y le fue contado por ______. (Gn 15:6)", options: ["justicia", "bendición", "salvación", "fe"], correct: 0 },
                { verse: "Pero Jehová había dicho a Abram: Vete de tu tierra y de tu ______, y de la casa de tu padre... (Gn 12:1)", options: ["parentela", "familia", "herencia", "nación"], correct: 0 },
                { verse: "Y llamó Abraham el nombre de aquel lugar, Jehová proveerá. Por tanto se dice hoy: En el ______ de Jehová será provisto. (Gn 22:14)", options: ["monte", "valle", "altar", "templo"], correct: 0 },
                { verse: "En el principio creó Dios los cielos y la ______. (Gn 1:1)", options: ["tierra", "mar", "creación", "luz"], correct: 0 },
                { verse: "Y dijo Dios: Sea la ______; y fue la ______. (Gn 1:3)", options: ["luz", "vida", "tierra", "expansión"], correct: 0 },
                { verse: "Tomó, pues, Jehová Dios al hombre, y lo puso en el huerto de Edén, para que lo labrara y lo ______. (Gn 2:15)", options: ["guardase", "cuidase", "gobernase", "dominase"], correct: 0 },
                { verse: "Y dijo Jehová Dios: No es bueno que el hombre esté solo; le haré ______ idónea para él. (Gn 2:18)", options: ["ayuda", "compañera", "pareja", "esposa"], correct: 0 },
                { verse: "Vosotros pensasteis mal contra mí, mas Dios lo encaminó a ______, para hacer lo que vemos hoy... (Gn 50:20)", options: ["bien", "salvación", "paz", "justicia"], correct: 0 }
            ];

            let activeEtapa1Questions = [];
            let activeEtapa2Questions = [];
            let activeEtapa3Questions = [];

            function getRandomQuestions(pool, count = 5) {
                const shuffled = [...pool].sort(() => 0.5 - Math.random());
                return shuffled.slice(0, count);
            }

            // ================== ESTADO DEL JUEGO ==================
            let playerName = '';
            let playerAge = '';
            let isPracticeMode = false;
            let totalScore = 0;
            let currentQuestionIndex = 0;
            let currentEtapa = 0;
            let flameIntensity = 0;
            let flameFlicker = 0;
            let titleAlpha = 0;
            let sparkParticles = [];
            let canClick = true;
            let celebrationAnimTime = 0;

            // ================== DIBUJO Y EFECTOS ==================
            function createSpark() {
                return {
                    x: W / 2 + (Math.random() - 0.5) * 20,
                    y: H * 0.55 - 20,
                    vx: (Math.random() - 0.5) * 2,
                    vy: -Math.random() * 3 - 1,
                    life: 1,
                    decay: 0.02 + Math.random() * 0.03,
                    size: 1 + Math.random() * 2
                };
            }

            function updateSparks() {
                sparkParticles = sparkParticles.filter(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= p.decay;
                    return p.life > 0;
                });
                if (flameIntensity > 0.3 && sparkParticles.length < 15 && Math.random() < 0.05) {
                    sparkParticles.push(createSpark());
                }
            }

            function drawSparks() {
                sparkParticles.forEach(p => {
                    ctx.fillStyle = `rgba(255, 200, 50, ${Math.max(0, p.life)})`;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                });
            }

            function drawLamp(intensity) {
                const cx = W / 2, baseY = H * 0.55;

                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath(); ctx.ellipse(cx, baseY + 80, 40, 8, 0, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#8B6914'; ctx.fillRect(cx - 30, baseY + 60, 60, 15);
                ctx.fillStyle = '#A0822A'; ctx.fillRect(cx - 25, baseY + 55, 50, 5);
                ctx.fillStyle = '#6B4F1A'; ctx.fillRect(cx - 8, baseY + 30, 16, 30);

                ctx.fillStyle = '#C9A84C'; ctx.beginPath(); ctx.ellipse(cx, baseY + 25, 35, 12, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#B8943A'; ctx.beginPath(); ctx.ellipse(cx, baseY + 22, 30, 8, 0, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = `rgba(255, 200, 50, ${intensity * 0.6})`;
                ctx.beginPath(); ctx.ellipse(cx, baseY + 20, 25, 6, 0, 0, Math.PI * 2); ctx.fill();

                if (intensity > 0.01) {
                    const flicker = Math.sin(flameFlicker * 8) * 3 + Math.cos(flameFlicker * 13) * 2;
                    const flameHeight = Math.max(5, 35 + flicker + intensity * 15);
                    const flameWidth = Math.max(4, 16 + Math.cos(flameFlicker * 6) * 2);

                    const glowRadius = Math.max(1, 80 * intensity);
                    const gradient = ctx.createRadialGradient(cx, baseY - flameHeight/2, 1, cx, baseY - flameHeight/2, glowRadius);
                    gradient.addColorStop(0, `rgba(255, 200, 50, ${intensity * 0.6})`);
                    gradient.addColorStop(0.4, `rgba(255, 150, 30, ${intensity * 0.3})`);
                    gradient.addColorStop(1, 'rgba(255, 100, 0, 0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath(); ctx.arc(cx, baseY - flameHeight/2, glowRadius, 0, Math.PI * 2); ctx.fill();

                    const flameGradient = ctx.createLinearGradient(cx, baseY, cx, baseY - flameHeight);
                    flameGradient.addColorStop(0, '#FF6B00');
                    flameGradient.addColorStop(0.3, '#FF8C00');
                    flameGradient.addColorStop(0.6, '#FFD700');
                    flameGradient.addColorStop(0.85, '#FFF8DC');
                    flameGradient.addColorStop(1, '#FFFFFF');
                    ctx.fillStyle = flameGradient;
                    ctx.beginPath();
                    ctx.moveTo(cx - flameWidth, baseY);
                    ctx.quadraticCurveTo(cx - flameWidth * 0.6, baseY - flameHeight * 0.5, cx, baseY - flameHeight);
                    ctx.quadraticCurveTo(cx + flameWidth * 0.6, baseY - flameHeight * 0.5, cx + flameWidth, baseY);
                    ctx.closePath(); ctx.fill();
                }
            }

            function drawAnimatedMedal(type, cx, cy) {
                const pulse = Math.sin(celebrationAnimTime * 3) * 4;
                const radius = 45 + pulse * 0.5;
                let color1 = '#CD7F32', color2 = '#8B5A2B';

                if (type === 'silver') { color1 = '#FFFFFF'; color2 = '#78909C'; }
                else if (type === 'gold') { color1 = '#FFF59D'; color2 = '#FBC02D'; }

                ctx.save();
                ctx.fillStyle = '#D32F2F';
                ctx.beginPath();
                ctx.moveTo(cx - 20, cy - radius); ctx.lineTo(cx - 35, cy - radius - 40);
                ctx.lineTo(cx - 15, cy - radius - 40); ctx.lineTo(cx, cy - radius);
                ctx.fill();

                ctx.fillStyle = '#1976D2';
                ctx.beginPath();
                ctx.moveTo(cx + 20, cy - radius); ctx.lineTo(cx + 35, cy - radius - 40);
                ctx.lineTo(cx + 15, cy - radius - 40); ctx.lineTo(cx, cy - radius);
                ctx.fill();

                const glow = ctx.createRadialGradient(cx, cy, 5, cx, cy, radius + 20);
                glow.addColorStop(0, color1); glow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, radius + 20, 0, Math.PI * 2); ctx.fill();

                const medalGradient = ctx.createRadialGradient(cx - 15, cy - 15, 5, cx, cy, radius);
                medalGradient.addColorStop(0, color1); medalGradient.addColorStop(0.7, color2); medalGradient.addColorStop(1, '#3a2a0a');
                ctx.fillStyle = medalGradient; ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = '#FFF'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, radius - 4, 0, Math.PI * 2); ctx.stroke();
                ctx.fillStyle = '#FFF'; ctx.font = 'bold 30px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('★', cx, cy - 2);

                for (let i = 0; i < 4; i++) {
                    const angle = celebrationAnimTime * 2 + (i * Math.PI / 2);
                    const sx = cx + Math.cos(angle) * (radius + 12);
                    const sy = cy + Math.sin(angle) * (radius + 12);
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }

            function drawJumpingPerson(cx, baseY) {
                const jumpY = Math.abs(Math.sin(celebrationAnimTime * 6)) * 35;
                const py = baseY - jumpY;

                ctx.save();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#F5E6C8';
                ctx.fillStyle = '#F5E6C8';

                const shadowScale = Math.max(0.3, 1 - (jumpY / 50));
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath(); ctx.ellipse(cx, baseY + 5, 25 * shadowScale, 6 * shadowScale, 0, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#F5E6C8';
                ctx.beginPath(); ctx.arc(cx, py - 55, 12, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = '#5A3D2B'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(cx, py - 54, 6, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();

                ctx.fillStyle = '#C9A84C';
                ctx.beginPath();
                ctx.moveTo(cx - 15, py - 40); ctx.lineTo(cx + 15, py - 40);
                ctx.lineTo(cx + 22, py - 5); ctx.lineTo(cx - 22, py - 5);
                ctx.closePath(); ctx.fill();

                ctx.strokeStyle = '#F5E6C8'; ctx.lineWidth = 4; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(cx - 12, py - 35); ctx.lineTo(cx - 28, py - 55); ctx.lineTo(cx - 35, py - 70); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + 12, py - 35); ctx.lineTo(cx + 28, py - 55); ctx.lineTo(cx + 35, py - 70); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx - 10, py - 5); ctx.lineTo(cx - 16, py + 12); ctx.moveTo(cx + 10, py - 5); ctx.lineTo(cx + 16, py + 12); ctx.stroke();

                ctx.restore();
            }

            function render() {
                flameFlicker += 0.03;
                celebrationAnimTime += 0.03;
                ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

                if (currentEtapa === 0) {
                    if (flameIntensity < 1.0) flameIntensity += 0.01;
                    if (flameIntensity >= 0.3 && titleAlpha < 1.0) titleAlpha += 0.02;

                    drawLamp(flameIntensity);
                    updateSparks();
                    drawSparks();

                    if (titleAlpha > 0) {
                        ctx.save();
                        ctx.globalAlpha = Math.min(1, titleAlpha);
                        ctx.fillStyle = '#FFD700'; ctx.font = 'bold 64px Georgia'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.shadowColor = '#FF8C00'; ctx.shadowBlur = 25;
                        ctx.fillText('LÁMPARA', W / 2, H * 0.22);
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#FFF8DC'; ctx.font = '22px Georgia';
                        ctx.fillText('Juego Bíblico - Génesis (RVR1960)', W / 2, H * 0.32);
                        ctx.fillStyle = 'rgba(255, 200, 100, 0.6)'; ctx.font = 'italic 14px Georgia';
                        ctx.fillText('"Lámpara es a mis pies tu palabra, y lumbrera a mi camino" - Salmo 119:105', W / 2, H * 0.38);
                        ctx.restore();
                    }

                    if (flameIntensity >= 0.8) {
                        const blink = Math.sin(flameFlicker * 3) * 0.3 + 0.7;
                        ctx.save(); ctx.globalAlpha = blink;
                        ctx.fillStyle = '#FFF'; ctx.font = '18px Georgia'; ctx.textAlign = 'center';
                        ctx.fillText('✦ Toca la pantalla para comenzar ✦', W / 2, H * 0.78);
                        ctx.restore();
                    }
                } else if (currentEtapa === 7) {
                    let medalType = totalScore < 25 ? 'bronze' : totalScore < 50 ? 'silver' : 'gold';
                    let quote = "";

                    if (medalType === 'gold') {
                        quote = "¡Extraordinario! Dominas las Escrituras con excelencia y sabiduría.";
                    } else if (medalType === 'silver') {
                        quote = "¡Buen trabajo! Tienes un sólido conocimiento de la Palabra.";
                    } else {
                        quote = "¡Sigue adelante! 'La exposición de tus palabras alumbra' (Salmo 119:130).";
                    }

                    updateSparks(); drawSparks();
                    drawJumpingPerson(W * 0.30, H * 0.58);
                    drawAnimatedMedal(medalType, W * 0.70, H * 0.45);

                    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 36px Georgia'; ctx.textAlign = 'center';
                    ctx.fillText('¡FELICIDADES!', W / 2, H * 0.12);
                    
                    ctx.fillStyle = '#FFF'; ctx.font = 'bold 24px Georgia'; 
                    ctx.fillText(`${playerName}`, W / 2, H * 0.20);
                    
                    ctx.fillStyle = '#E0C060'; ctx.font = 'bold 28px Georgia'; 
                    ctx.fillText(`${totalScore} / 75 PUNTOS`, W / 2, H * 0.27);

                    ctx.save();
                    ctx.fillStyle = '#FFF8DC'; ctx.font = 'italic 16px Georgia';
                    ctx.shadowColor = 'rgba(255, 215, 0, 0.4)'; ctx.shadowBlur = 10;
                    ctx.fillText(quote, W / 2, H * 0.72);
                    ctx.restore();

                    if (isPracticeMode) {
                        ctx.fillStyle = '#A0822A'; ctx.font = '14px Georgia';
                        ctx.fillText('(Modo Práctica - Tu primer puntaje no ha cambiado)', W / 2, H * 0.78);
                    }

                    const blink = Math.sin(flameFlicker * 2) * 0.3 + 0.7;
                    ctx.save(); ctx.globalAlpha = blink;
                    ctx.fillStyle = '#AAA'; ctx.font = '14px Georgia';
                    ctx.fillText('✦ Toca la pantalla para reiniciar ✦', W / 2, H * 0.90);
                    ctx.restore();
                }

                animationId = requestAnimationFrame(render);
            }

            // ================== DIÁLOGOS Y VENTANAS ==================
            function showDialog(htmlContent) {
                dialogOverlay.classList.remove('closing');
                dialogBox.innerHTML = htmlContent;
                dialogOverlay.classList.add('active');
            }

            function hideDialog(callback) {
                stopQuestionTimer();
                dialogOverlay.classList.add('closing');
                dialogOverlay.classList.remove('active');
                setTimeout(() => {
                    dialogOverlay.classList.remove('closing');
                    dialogBox.innerHTML = '';
                    if (callback) callback();
                }, 350);
            }

            function showStageIntro(title, description, onStartCallback) {
                showDialog(`
                    <h2>📜 ${title}</h2>
                    <p class="description">${description}</p>
                    <button id="startStageBtn">COMENZAR RETO</button>
                `);

                document.getElementById('startStageBtn').onclick = () => {
                    hideDialog(onStartCallback);
                };
            }

            function showRegistrationDialog() {
                showDialog(`
                    <h2>🕯️ LÁMPARA</h2>
                    <p style="color:#5a3d2b; margin-bottom:10px; font-size:1em;">Ingresa tus datos para empezar:</p>
                    <input type="text" id="nameInput" placeholder="Tu nombre" maxlength="20" autocomplete="off">
                    <input type="number" id="ageInput" placeholder="Tu edad" min="5" max="120" autocomplete="off">
                    <br>
                    <button id="startBtn">COMENZAR JUEGO</button>
                    <button id="leaderboardBtn" style="background:linear-gradient(180deg, #8B6914 0%, #6B4F1A 100%); border-color:#5a3d2b; margin-top:5px;">VER CLASIFICACIÓN GLOBAL</button>
                `);

                const nameInput = document.getElementById('nameInput');
                const ageInput = document.getElementById('ageInput');
                setTimeout(() => nameInput.focus(), 100);

                document.getElementById('startBtn').onclick = async () => {
                    const name = nameInput.value.trim();
                    const age = parseInt(ageInput.value);
                    
                    if (name && age >= 5 && age <= 120) {
                        playerName = name; 
                        playerAge = age;

                        activeEtapa1Questions = getRandomQuestions(poolEtapa1, 5);
                        activeEtapa2Questions = getRandomQuestions(poolEtapa2, 5);
                        activeEtapa3Questions = getRandomQuestions(poolEtapa3, 5);

                        const exists = await checkPlayerExists(playerName, playerAge);
                        isPracticeMode = exists;

                        hideDialog(prepareEtapa1);
                    } else {
                        playSound('wrong');
                        if (!name) nameInput.style.borderColor = '#f44336';
                        if (!age) ageInput.style.borderColor = '#f44336';
                    }
                };

                document.getElementById('leaderboardBtn').onclick = async () => {
                    showDialog(`<h2>🏆 CLASIFICACIÓN GLOBAL</h2><p style="color:#5a3d2b; margin:15px;">Cargando puntuaciones...</p>`);
                    
                    const scores = await getTopScores();
                    let rows = scores.map((s, i) => `
                        <tr>
                            <td>${i+1}</td>
                            <td>${s.nombre}</td>
                            <td>${s.edad}</td>
                            <td>${s.puntos}</td>
                            <td>${s.medalla === 'gold' ? '🥇' : s.medalla === 'silver' ? '🥈' : '🥉'}</td>
                        </tr>
                    `).join('');

                    if(!rows) rows = '<tr><td colspan="5" style="text-align:center;">Sin puntajes aún</td></tr>';
                    
                    showDialog(`
                        <h2>🏆 CLASIFICACIÓN GLOBAL</h2>
                        <div class="leaderboard">
                            <table>
                                <thead><tr><th>#</th><th>Nombre</th><th>Edad</th><th>Pts</th><th>Medalla</th></tr></thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                        <button id="backBtn">VOLVER</button>
                    `);
                    document.getElementById('backBtn').onclick = showRegistrationDialog;
                };
            }

            // ================== FLUJO DE ETAPAS ==================
            function prepareEtapa1() {
                showStageIntro(
                    "ETAPA 1: CONOCIMIENTO BÍBLICO",
                    "Demuestra tus conocimientos generales sobre los acontecimientos, personajes y datos clave según la versión Reina-Valera 1960. ¡Tienes 15 segundos por pregunta!",
                    startEtapa1
                );
            }

            function startEtapa1() {
                currentEtapa = 2; currentQuestionIndex = 0; totalScore = 0;
                showQuestion(activeEtapa1Questions, 'ETAPA 1: CONOCIMIENTO');
            }

            function prepareEtapa2() {
                showStageIntro(
                    "ETAPA 2: ESGRIMA BÍBLICO",
                    "Pon a prueba tu agilidad mental identificando exactamente en qué capítulo de Génesis ocurren los sucesos narrados.",
                    startEtapa2
                );
            }

            function startEtapa2() {
                currentEtapa = 4; currentQuestionIndex = 0;
                showQuestion(activeEtapa2Questions, 'ETAPA 2: ESGRIMA');
            }

            function prepareEtapa3() {
                showStageIntro(
                    "ETAPA 3: COMPLETA EL VERSÍCULO",
                    "Se te presentarán pasajes clave de Génesis al pie de la letra según la versión Reina-Valera 1960. Selecciona la palabra exacta que falta.",
                    startEtapa3
                );
            }

            function startEtapa3() {
                currentEtapa = 6; currentQuestionIndex = 0;
                showQuestion(activeEtapa3Questions, 'ETAPA 3: VERSÍCULOS');
            }

            // ================== TEMPORIZADOR Y PREGUNTAS ==================
            function startQuestionTimer(onTimeUp) {
                stopQuestionTimer();
                timeLeft = QUESTION_TIME_LIMIT;
                
                const timerBadge = document.getElementById('timerBadge');
                const timerFill = document.getElementById('timerFill');
                
                if (!timerBadge || !timerFill) return;

                timerInterval = setInterval(() => {
                    timeLeft--;
                    timerBadge.innerHTML = `⏱️ ${timeLeft}s`;
                    
                    const percentage = (timeLeft / QUESTION_TIME_LIMIT) * 100;
                    timerFill.style.width = `${percentage}%`;

                    if (timeLeft <= 5) {
                        timerBadge.classList.add('urgent');
                        timerFill.style.backgroundColor = 'var(--red)';
                        playSound('tick');
                    }

                    if (timeLeft <= 0) {
                        stopQuestionTimer();
                        onTimeUp();
                    }
                }, 1000);
            }

            function stopQuestionTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }

            function showQuestion(questions, etapaTitle) {
                const q = questions[currentQuestionIndex];
                const progress = (currentQuestionIndex / questions.length) * 100;

                let questionHTML = currentEtapa === 6
                    ? `<div class="verse-display">"${q.verse.replace('______', '<span class="verse-missing">______</span>')}"</div>`
                    : `<p style="color:#333; font-size:1em; margin:6px 0; font-weight:bold; line-height:1.3;">${q.question}</p>`;

                showDialog(`
                    <h2 style="color:#5a3d2b;">${etapaTitle}</h2>
                    ${isPracticeMode ? '<div class="status-badge">🎮 Modo Práctica</div>' : ''}
                    <div class="timer-container">
                        <span style="color:#8B6914; font-size:0.8em;">Pregunta ${currentQuestionIndex + 1} de ${questions.length}</span>
                        <div class="timer-badge" id="timerBadge">⏱️ ${QUESTION_TIME_LIMIT}s</div>
                    </div>
                    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
                    <div class="score-display">⭐ ${totalScore} pts</div>
                    ${questionHTML}
                    <div class="options-container">
                        ${q.options.map((opt, idx) => `<button class="option-btn" data-index="${idx}">${String.fromCharCode(65 + idx)}. ${opt}</button>`).join('')}
                    </div>
                `);

                startQuestionTimer(() => {
                    handleAnswer(-1, q.correct, questions, etapaTitle);
                });

                document.querySelectorAll('.option-btn').forEach(btn => {
                    btn.onclick = (e) => {
                        stopQuestionTimer();
                        const selected = parseInt(e.target.dataset.index);
                        handleAnswer(selected, q.correct, questions, etapaTitle);
                    };
                });
            }

            function handleAnswer(selected, correct, questions, etapaTitle) {
                stopQuestionTimer();
                const buttons = document.querySelectorAll('.option-btn');
                
                buttons.forEach((btn, idx) => {
                    btn.disabled = true;
                    if (idx === correct) { btn.classList.add('correct'); btn.innerHTML += ' ✓'; }
                    if (idx === selected && idx !== correct) { btn.classList.add('incorrect'); btn.innerHTML += ' ✗'; }
                });

                if (selected === correct) {
                    totalScore += 5; playSound('correct');
                } else {
                    playSound('wrong');
                }

                setTimeout(() => {
                    hideDialog(() => {
                        currentQuestionIndex++;
                        if (currentQuestionIndex < questions.length) {
                            showQuestion(questions, etapaTitle);
                        } else {
                            setTimeout(() => {
                                if (currentEtapa === 2) {
                                    prepareEtapa2();
                                } else if (currentEtapa === 4) {
                                    prepareEtapa3();
                                } else if (currentEtapa === 6) {
                                    showFinalScreen();
                                }
                            }, 350);
                        }
                    });
                }, 1600);
            }

            async function showFinalScreen() {
                currentEtapa = 7;
                stopQuestionTimer();
                let medalType = totalScore < 25 ? 'bronze' : totalScore < 50 ? 'silver' : 'gold';
                
                await saveSupabaseScore(playerName, playerAge, totalScore, medalType);
                playSound('win');
            }

            // ================== EVENTOS Y RESPONSIVIDAD ==================
            function handleInteraction() {
                initAudio();
                if (!canClick) return;

                if (currentEtapa === 0) {
                    canClick = false;
                    showRegistrationDialog();
                    setTimeout(() => canClick = true, 500);
                } else if (currentEtapa === 7) {
                    canClick = false;
                    location.reload();
                }
            }

            canvas.addEventListener('click', handleInteraction);
            canvas.addEventListener('touchstart', (e) => {
                if (currentEtapa === 0 || currentEtapa === 7) {
                    e.preventDefault();
                    handleInteraction();
                }
            }, { passive: false });

            render();
        });
    </script>
</body>
</html>
